<script>
  // Global State
  let allBookings = [];
  let isAdmin = false;
  let currentUser = null;
  let adminAuth = null;

  // Charts Instances
  let carChart = null;
  let workChart = null;

  document.addEventListener('DOMContentLoaded', function() {
    try {
      console.log("App initializing...");
      showLoading(true);

      // Initialize Listeners first to ensure buttons work even if data fails
      initEventListeners();

      // Load Data
      loadPublicVehicles();
      loadBookings();

      // Admin stats (safe to call, will just return error if not admin)
      loadStats();

      // Initialize Driving Mode state
      toggleDriveOption();

    } catch (e) {
      console.error("Critical Initialization Error:", e);
      Swal.fire('System Error', 'Failed to initialize application. Please refresh.', 'error');
      showLoading(false);
    }
  });

  function initEventListeners() {
    try {
      // Form Submission
      const form = document.getElementById('bookingForm');
      if (form) {
        form.addEventListener('submit', handleFormSubmit);
      } else {
        console.warn('bookingForm not found');
      }

      // Dynamic Form Fields
      const vSelect = document.getElementById('vehicleType');
      if (vSelect) vSelect.addEventListener('change', toggleOtherVehicle);

      const wSelect = document.getElementById('workType');
      if (wSelect) wSelect.addEventListener('change', toggleOtherWork);

      // Driving Mode Toggles
      const driveRadios = document.querySelectorAll('input[name="driveOption"]');
      driveRadios.forEach(el => el.addEventListener('change', toggleDriveOption));

      // Admin Login
      const loginBtn = document.getElementById('adminLoginBtn');
      if (loginBtn) {
        loginBtn.addEventListener('click', showAdminLogin);
      } else {
        console.warn('adminLoginBtn not found');
      }

      // Filter Inputs
      ['searchFilter', 'statusFilter', 'carFilter', 'filterStartDate', 'filterEndDate'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', renderBookingsTable);
      });

    } catch (e) {
      console.error("Error in initEventListeners:", e);
    }
  }

  function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // --- Core Functions ---

  function showLoading(show = true) {
    const el = document.getElementById('loadingOverlay');
    if (el) el.style.display = show ? 'flex' : 'none';
  }

  // --- Dynamic Vehicles Loading ---
  function loadPublicVehicles() {
    google.script.run
      .withSuccessHandler(res => {
         if(res.success) {
           renderPublicVehicles(res.vehicles);
         } else {
           console.error("Failed to load vehicles:", res.message);
           // Update UI to show error instead of infinite loading
           const container = document.getElementById('calendarCardsContainer');
           if (container) container.innerHTML = `<div class="col-12 text-center text-danger py-5">Unable to load vehicles: ${escapeHtml(res.message)}</div>`;

           // Also update dropdown
           const select = document.getElementById('vehicleType');
           if (select) select.innerHTML = '<option disabled selected>Error loading vehicles</option>';
         }
      })
      .withFailureHandler(err => {
         console.error("Server Error (loadPublicVehicles):", err);
         const container = document.getElementById('calendarCardsContainer');
         if (container) container.innerHTML = `<div class="col-12 text-center text-danger py-5">Connection Error. Please refresh.</div>`;
      })
      .getPublicVehicles();
  }

  function renderPublicVehicles(vehicles) {
    // 1. Populate Dropdown
    const select = document.getElementById('vehicleType');
    if (select) {
      select.innerHTML = '<option value="" selected disabled>-- เลือกรถ --</option>';
      vehicles.forEach(v => {
         const opt = document.createElement('option');
         opt.value = v.name;
         opt.textContent = v.name;
         select.appendChild(opt);
      });
      // Add "Other"
      const otherOpt = document.createElement('option');
      otherOpt.value = 'อื่นๆ ให้ระบุ';
      otherOpt.textContent = 'อื่นๆ ให้ระบุ';
      select.appendChild(otherOpt);
    }

    // 2. Populate Calendar Tab Cards
    const calContainer = document.getElementById('calendarCardsContainer');
    if (calContainer) {
      calContainer.innerHTML = '';

      if (!vehicles || vehicles.length === 0) {
        calContainer.innerHTML = '<div class="col-12 text-center text-muted py-5">No active vehicles available.</div>';
      } else {
        const colors = ['primary', 'info', 'success', 'warning', 'danger'];
        vehicles.forEach((v, idx) => {
           const color = colors[idx % colors.length];
           // Only show if it has a calendar
           if(!v.calendarId && !v.calendarUrl) return;

           // Determine Link
           let link = v.calendarUrl;
           if (!link && v.calendarId) {
              link = `https://calendar.google.com/calendar/u/0/embed?src=${v.calendarId}&ctz=Asia/Bangkok`;
           }

           // Use uploaded image or placeholder if missing
           let imgHtml = '';
           if (v.image) {
              const imgSrc = v.image.startsWith('http') ? v.image : `https://drive.google.com/uc?export=view&id=${v.image}`;
              imgHtml = `<img src="${imgSrc}" class="card-img-top" style="height:160px; object-fit:cover;" alt="${escapeHtml(v.name)}">`;
           }

           const col = document.createElement('div');
           col.className = 'col-md-6 col-lg-4';
           col.innerHTML = `
             <div class="card h-100 shadow-sm border-0 hover-lift">
                ${imgHtml}
                <div class="card-body text-center">
                   <h5 class="card-title text-${color}">${escapeHtml(v.name)}</h5>
                   <a href="${link}" target="_blank" class="btn btn-outline-${color} mt-3 rounded-pill w-100">
                      <i class="fas fa-calendar-alt me-2"></i>${escapeHtml(v.buttonLabel || 'View Calendar')}
                   </a>
                </div>
             </div>
           `;
           calContainer.appendChild(col);
        });
      }
    }

    // 3. Populate Filter Dropdown
    const filterSelect = document.getElementById('carFilter');
    if (filterSelect) {
      filterSelect.innerHTML = '<option value="all">รถทั้งหมด</option>';
      vehicles.forEach(v => {
         const opt = document.createElement('option');
         opt.value = v.name;
         opt.textContent = v.name;
         filterSelect.appendChild(opt);
      });
      const otherF = document.createElement('option');
      otherF.value = 'อื่นๆ ให้ระบุ';
      otherF.textContent = 'อื่นๆ ให้ระบุ';
      filterSelect.appendChild(otherF);
    }
  }

  function handleFormSubmit(e) {
    e.preventDefault();
    if (!this.checkValidity()) {
      e.stopPropagation();
      this.classList.add('was-validated');
      return;
    }

    // Collect Data
    const driveOptEl = document.querySelector('input[name="driveOption"]:checked');
    const driveOpt = driveOptEl ? driveOptEl.value : 'SELF';
    const hasLicenseEl = document.getElementById('hasLicense');

    const formData = {
      name: val('name'),
      department: val('department'),
      email: val('email'),
      date: val('date'),
      startTime: val('startTime'),
      returnDate: val('returnDate'),
      returnTime: val('returnTime'),

      originPlace: val('originPlace'),
      originReason: val('originReason'),
      originAddress: val('originAddress'),
      originContact: val('originContact'),
      originMap: val('originMap'),

      dest1Place: val('dest1Place'),
      dest1Reason: val('dest1Reason'),
      dest1Address: val('dest1Address'),
      dest1Contact: val('dest1Contact'),
      dest1Map: val('dest1Map'),

      dest2Place: val('dest2Place'),
      dest2Reason: val('dest2Reason'),
      dest2Address: val('dest2Address'),
      dest2Contact: val('dest2Contact'),
      dest2Map: val('dest2Map'),

      extraDetails: val('extraDetails'),

      // New Fields
      driveOption: driveOpt,
      hasLicense: (driveOpt === 'SELF' && hasLicenseEl && hasLicenseEl.checked) ? true : false,
      driverName: (driveOpt === 'DRIVER') ? val('driverName') : ''
    };

    // Handle "Other" logic
    const vType = val('vehicleType');
    formData.vehicleTypes = (vType === 'อื่นๆ ให้ระบุ' || vType === 'other') ? `อื่นๆ: ${val('vehicleOther')}` : vType;
    formData.car = formData.vehicleTypes;

    const wType = val('workType');
    formData.workTypes = (wType === 'otherWork') ? `อื่นๆ: ${val('workOther')}` : wType;

    showLoading(true);
    google.script.run
      .withSuccessHandler(res => {
        showLoading(false);
        if (res.success) {
          Swal.fire('สำเร็จ!', res.message, 'success');
          document.getElementById('bookingForm').reset();
          document.getElementById('bookingForm').classList.remove('was-validated');
          // Reset driving mode state
          toggleDriveOption();
          // Switch to list tab
          const listTab = document.querySelector('#nav-list-tab');
          if (listTab) new bootstrap.Tab(listTab).show();
          loadBookings();
        } else {
          Swal.fire('เกิดข้อผิดพลาด', res.message, 'error');
        }
      })
      .withFailureHandler(err => {
        showLoading(false);
        Swal.fire('Error', 'Server connection failed: ' + err.message, 'error');
      })
      .submitBooking(formData);
  }

  function loadBookings() {
    google.script.run
      .withSuccessHandler(res => {
        showLoading(false); // Ensure loader stops
        if (res.ok) {
          allBookings = res.bookings || [];
          // Maintain admin status if already logged in via client-side token
          if (adminAuth) {
             isAdmin = true;
          } else {
             isAdmin = res.isAdmin;
          }
          updateUIForAdmin();
          renderBookingsTable();
        } else {
          console.error("Failed load bookings:", res.error);
          const tbody = document.getElementById('bookingTableBody');
          if (tbody) tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">Error: ${escapeHtml(res.error)}</td></tr>`;
        }
      })
      .withFailureHandler(err => {
        showLoading(false);
        console.error("Server Error (getBookings):", err);
        const tbody = document.getElementById('bookingTableBody');
        if (tbody) tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">Connection Error</td></tr>`;
        // Only alert if we are on the list tab?
        // Swal.fire('Error', 'Failed to load bookings.', 'error');
      })
      .getBookings();
  }

  function renderBookingsTable() {
    const tbody = document.getElementById('bookingTableBody');
    if (!tbody) return;
    tbody.innerHTML = '';

    if (!allBookings || allBookings.length === 0) {
       tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">No records found.</td></tr>';
       return;
    }

    const filterText = val('searchFilter').toLowerCase();
    const filterStatus = val('statusFilter');
    const filterCar = val('carFilter');

    const filterStart = document.getElementById('filterStartDate').value;
    const filterEnd = document.getElementById('filterEndDate').value;

    const filtered = allBookings.filter(b => {
      // Text Filter
      const matchText = [b.name, b.department, b.dest1Place, b.car].some(s => String(s).toLowerCase().includes(filterText));
      // Dropdown Filters
      const matchStatus = filterStatus === 'all' || b.status === filterStatus;
      const matchCar = filterCar === 'all' || b.car === filterCar;
      // Date Range Filter
      let matchDate = true;
      if (filterStart) matchDate = matchDate && (b.date >= filterStart);
      if (filterEnd) matchDate = matchDate && (b.date <= filterEnd);

      return matchText && matchStatus && matchCar && matchDate;
    });

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">ไม่พบข้อมูลตามเงื่อนไข</td></tr>';
      return;
    }

    filtered.forEach(b => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><div class="fw-bold">${escapeHtml(b.date)}</div><small class="text-muted">${escapeHtml(b.startTime)} - ${escapeHtml(b.endTime)}</small></td>
        <td><div class="fw-bold">${escapeHtml(b.name)}</div><small>${escapeHtml(b.department)}</small></td>
        <td>${escapeHtml(b.car)}</td>
        <td>${escapeHtml(b.dest1Place)}</td>
        <td>${escapeHtml(b.workTypes)}</td>
        <td><span class="status-badge ${getStatusClass(b.status)}">${escapeHtml(b.status)}</span></td>
        <td>
          <button class="btn btn-sm btn-info text-white me-1" onclick='viewDetail(${JSON.stringify(JSON.stringify(b))})'><i class="fas fa-eye"></i></button>
          ${isAdmin ? getAdminButtons(b) : ''}
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // --- Admin Functions ---

  function showAdminLogin() {
    Swal.fire({
      title: 'Admin Login',
      html: `
        <input type="text" id="login-username" class="swal2-input" placeholder="Username">
        <input type="password" id="login-password" class="swal2-input" placeholder="Password">
      `,
      focusConfirm: false,
      showCancelButton: true,
      confirmButtonText: 'Login',
      showLoaderOnConfirm: true,
      preConfirm: () => {
        const u = document.getElementById('login-username').value;
        const p = document.getElementById('login-password').value;

        if (!u || !p) {
          Swal.showValidationMessage('Please enter both username and password');
          return false;
        }

        return new Promise((resolve) => {
          google.script.run
            .withSuccessHandler(res => {
               if(res.success) {
                 resolve({ user: res.user, auth: { username: u, password: p } });
               } else {
                 Swal.showValidationMessage(res.message || 'Login failed');
                 resolve(false);
               }
            })
            .withFailureHandler(err => {
               Swal.showValidationMessage('Error: ' + err.message);
               resolve(false);
            })
            .adminLogin(u, p);
        });
      },
      allowOutsideClick: () => !Swal.isLoading()
    }).then((result) => {
      if (result.isConfirmed && result.value) {
        isAdmin = true;
        currentUser = result.value.user;
        adminAuth = result.value.auth;

        updateUIForAdmin();
        renderBookingsTable();
        Swal.fire('Logged in', `Welcome ${currentUser.name}`, 'success');

        // Load admin tabs data if on admin tab
        loadAdmins();
        loadVehiclesAdmin();
      }
    });
  }

  function logoutAdmin() {
    isAdmin = false;
    currentUser = null;
    adminAuth = null;
    const tabLink = document.getElementById('adminTabLink');
    if (tabLink) tabLink.classList.add('d-none');

    const loginBtn = document.getElementById('adminLoginBtn');
    if (loginBtn) loginBtn.classList.remove('d-none');

    // Switch to home
    const homeTab = document.querySelector('#nav-home-tab');
    if (homeTab) new bootstrap.Tab(homeTab).show();

    renderBookingsTable();
  }

  function updateUIForAdmin() {
    if (isAdmin) {
      const tabLink = document.getElementById('adminTabLink');
      if (tabLink) tabLink.classList.remove('d-none');

      const loginBtn = document.getElementById('adminLoginBtn');
      if (loginBtn) loginBtn.classList.add('d-none');
    }
  }

  function getAdminButtons(b) {
    let html = '';

    // Status Buttons (Approve/Reject) for Pending items
    if (b.status === 'Pending') {
      html += `<button class="btn btn-sm btn-success me-1" onclick="approveBooking(${b.rowNumber})" title="อนุมัติ"><i class="fas fa-check"></i></button>`;
      html += `<button class="btn btn-sm btn-danger me-1" onclick="rejectBooking(${b.rowNumber})" title="ปฏิเสธ"><i class="fas fa-times"></i></button>`;
    } else {
      // For Approved/Rejected: Edit Status button
      html += `<button class="btn btn-sm btn-warning text-white me-1" onclick="editStatus(${b.rowNumber}, '${b.status}')" title="แก้ไขสถานะ"><i class="fas fa-pen"></i></button>`;
    }

    // PDF Button
    if (b.status === 'Approved' || b.status === 'Rejected') {
      html += `<button class="btn btn-sm btn-secondary" onclick="exportPdf(${b.rowNumber})" title="PDF"><i class="fas fa-file-pdf"></i></button>`;
    }
    return html;
  }

  // --- Admin Dashboard Logic ---

  function loadAdmins() {
    if(!isAdmin) return;
    google.script.run.withSuccessHandler(res => {
      if(res.success) {
        const tbody = document.getElementById('adminsTableBody');
        if (tbody) {
          tbody.innerHTML = '';
          res.admins.forEach(a => {
             // Display logic
             const avatarUrl = a.avatar ? (a.avatar.startsWith('http') ? a.avatar : `https://drive.google.com/uc?export=view&id=${a.avatar}`) : 'https://via.placeholder.com/40';

             const tr = document.createElement('tr');
             tr.innerHTML = `
               <td><img src="${avatarUrl}" class="rounded-circle border" width="40" height="40" style="object-fit:cover;"></td>
               <td>${escapeHtml(a.username)}</td>
               <td>${escapeHtml(a.fullName)}</td>
               <td>${escapeHtml(a.email)}</td>
               <td><span class="badge bg-secondary">${escapeHtml(a.role)}</span></td>
               <td>${a.isActive ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-danger">Inactive</span>'}</td>
               <td>
                 <button class="btn btn-sm btn-primary" onclick='openAdminModal(${JSON.stringify(JSON.stringify(a))})'><i class="fas fa-edit"></i></button>
               </td>
             `;
             tbody.appendChild(tr);
          });
        }
      }
    }).getAllAdmins(adminAuth);
  }

  function openAdminModal(admin = null) {
    const isEdit = !!admin;
    admin = isEdit ? JSON.parse(admin) : {};

    document.getElementById('adminModalTitle').innerText = isEdit ? 'Edit Admin' : 'Add New Admin';
    document.getElementById('adminEditId').value = admin.id || '';
    document.getElementById('adminUsername').value = admin.username || '';
    // document.getElementById('adminUsername').disabled = isEdit; // User requested ability to change username
    document.getElementById('adminPassword').value = '';
    document.getElementById('adminFullName').value = admin.fullName || '';
    document.getElementById('adminEmail').value = admin.email || '';
    document.getElementById('adminRole').value = admin.role || 'Admin';
    document.getElementById('adminIsActive').checked = (admin.isActive !== false);

    document.getElementById('adminAvatarId').value = admin.avatar || '';
    const prevUrl = admin.avatar ? (admin.avatar.startsWith('http') ? admin.avatar : `https://drive.google.com/uc?export=view&id=${admin.avatar}`) : 'https://via.placeholder.com/100';
    document.getElementById('adminPreviewImg').src = prevUrl;

    new bootstrap.Modal(document.getElementById('adminModal')).show();
  }

  function submitAdminForm() {
     const id = val('adminEditId');
     const username = val('adminUsername');
     const password = val('adminPassword');
     const fullName = val('adminFullName');
     const email = val('adminEmail');
     const role = val('adminRole');
     const isActive = document.getElementById('adminIsActive').checked;
     const avatarId = val('adminAvatarId');

     if(!username) { Swal.fire('Error', 'Username required', 'warning'); return; }

     const data = { id, username, password, fullName, email, role, isActive, avatar: avatarId };

     // Check if file upload is pending
     const fileInput = document.getElementById('adminAvatarFile');
     if(fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
           const base64 = e.target.result.split(',')[1];
           showLoading(true);
           google.script.run.withSuccessHandler(res => {
              if(res.success) {
                 data.avatar = res.fileId;
                 saveAdminData(data);
              } else {
                 showLoading(false);
                 Swal.fire('Upload Failed', res.message, 'error');
              }
           }).uploadFile(base64, file.type, file.name);
        };
        reader.readAsDataURL(file);
     } else {
        showLoading(true);
        saveAdminData(data);
     }
  }

  function saveAdminData(data) {
     google.script.run.withSuccessHandler(res => {
        showLoading(false);
        if(res.success) {
           bootstrap.Modal.getInstance(document.getElementById('adminModal')).hide();
           Swal.fire('Saved', res.message, 'success');
           loadAdmins();
        } else {
           Swal.fire('Error', res.message, 'error');
        }
     }).saveAdmin(data, adminAuth);
  }

  function loadVehiclesAdmin() {
    if(!isAdmin) return;
    google.script.run.withSuccessHandler(res => {
       if(res.success) {
          const tbody = document.getElementById('vehiclesTableBody');
          if (tbody) {
            tbody.innerHTML = '';
            res.vehicles.forEach(v => {
               const imgUrl = v.image ? (v.image.startsWith('http') ? v.image : `https://drive.google.com/uc?export=view&id=${v.image}`) : 'https://via.placeholder.com/50';

               const tr = document.createElement('tr');
               tr.innerHTML = `
                 <td><img src="${imgUrl}" class="rounded border" width="60" height="40" style="object-fit:cover;"></td>
                 <td>${escapeHtml(v.name)}</td>
                 <td><small class="text-muted text-break" style="max-width:200px;display:block;">${escapeHtml(v.calendarId)}</small></td>
                 <td>${v.isActive ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>'}</td>
                 <td>
                   <button class="btn btn-sm btn-primary" onclick='openVehicleModal(${JSON.stringify(JSON.stringify(v))})'><i class="fas fa-edit"></i></button>
                   <button class="btn btn-sm btn-danger ms-1" onclick="deleteVehicle('${v.id}')"><i class="fas fa-trash"></i></button>
                 </td>
               `;
               tbody.appendChild(tr);
            });
          }
       }
    }).getAllVehicles(adminAuth);
  }

  function openVehicleModal(v = null) {
     const isEdit = !!v;
     v = isEdit ? JSON.parse(v) : {};

     document.getElementById('vehicleModalTitle').innerText = isEdit ? 'Edit Vehicle' : 'Add Vehicle';
     document.getElementById('vehicleEditId').value = v.id || '';
     document.getElementById('vehicleName').value = v.name || '';
     document.getElementById('vehicleCalId').value = v.calendarId || '';
     document.getElementById('vehicleBtnLabel').value = v.buttonLabel || '';
     document.getElementById('vehicleIsActive').checked = (v.isActive !== false);

     document.getElementById('vehicleImageId').value = v.image || '';
     const prevUrl = v.image ? (v.image.startsWith('http') ? v.image : `https://drive.google.com/uc?export=view&id=${v.image}`) : 'https://via.placeholder.com/150x100';
     document.getElementById('vehiclePreviewImg').src = prevUrl;

     new bootstrap.Modal(document.getElementById('vehicleModal')).show();
  }

  function submitVehicleForm() {
     const id = val('vehicleEditId');
     const name = val('vehicleName');
     const calendarId = val('vehicleCalId');
     const buttonLabel = val('vehicleBtnLabel');
     const isActive = document.getElementById('vehicleIsActive').checked;
     const imageId = val('vehicleImageId');

     if(!name) { Swal.fire('Error', 'Display Name required', 'warning'); return; }

     const data = { id, name, calendarId, buttonLabel, isActive, image: imageId };

     const fileInput = document.getElementById('vehicleImageFile');
     if(fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
           const base64 = e.target.result.split(',')[1];
           showLoading(true);
           google.script.run.withSuccessHandler(res => {
              if(res.success) {
                 data.image = res.fileId;
                 saveVehicleData(data);
              } else {
                 showLoading(false);
                 Swal.fire('Upload Failed', res.message, 'error');
              }
           }).uploadFile(base64, file.type, file.name);
        };
        reader.readAsDataURL(file);
     } else {
        showLoading(true);
        saveVehicleData(data);
     }
  }

  function saveVehicleData(data) {
     google.script.run.withSuccessHandler(res => {
        showLoading(false);
        if(res.success) {
           bootstrap.Modal.getInstance(document.getElementById('vehicleModal')).hide();
           Swal.fire('Saved', 'Vehicle saved.', 'success');
           loadVehiclesAdmin();
        } else {
           Swal.fire('Error', res.message, 'error');
        }
     }).saveVehicle(data, adminAuth);
  }

  function deleteVehicle(id) {
    Swal.fire({
      title: 'Are you sure?',
      text: "Delete this vehicle configuration?",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      confirmButtonText: 'Yes, delete it!'
    }).then((result) => {
      if (result.isConfirmed) {
        showLoading(true);
        google.script.run.withSuccessHandler(res => {
           showLoading(false);
           if(res.success) {
              Swal.fire('Deleted!', 'Vehicle has been deleted.', 'success');
              loadVehiclesAdmin();
           } else {
              Swal.fire('Error', res.message, 'error');
           }
        }).deleteVehicle(id, adminAuth);
      }
    })
  }

  function previewFile(inputId, imgId) {
     const input = document.getElementById(inputId);
     const img = document.getElementById(imgId);
     if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
           img.src = e.target.result;
        }
        reader.readAsDataURL(input.files[0]);
     }
  }

  // --- Misc Helpers ---
  function editStatus(row, currentStatus) {
    Swal.fire({
      title: 'แก้ไขสถานะ',
      text: `สถานะปัจจุบัน: ${currentStatus}`,
      showDenyButton: true,
      showCancelButton: true,
      confirmButtonText: 'Approve',
      denyButtonText: 'Reject',
      confirmButtonColor: '#1cc88a',
      denyButtonColor: '#e74a3b'
    }).then((result) => {
      if (result.isConfirmed) {
        if (currentStatus === 'Approved') {
           Swal.fire('รายการนี้ Approved อยู่แล้ว', '', 'info');
           return;
        }
        approveBooking(row);
      } else if (result.isDenied) {
        if (currentStatus === 'Rejected') {
           Swal.fire('รายการนี้ Rejected อยู่แล้ว', '', 'info');
           return;
        }
        rejectBooking(row);
      }
    });
  }

  function approveBooking(row) {
    Swal.fire({
      title: 'ยืนยันการอนุมัติ?',
      text: "ระบบจะลงปฏิทินและแจ้งเตือนผู้จอง",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#1cc88a',
      confirmButtonText: 'อนุมัติ'
    }).then((result) => {
      if (result.isConfirmed) {
        showLoading(true);
        google.script.run.withSuccessHandler(afterUpdate).updateBookingStatus(row, 'Approved', null, currentUser, adminAuth);
      }
    });
  }

  function rejectBooking(row) {
    Swal.fire({
      title: 'ปฏิเสธคำขอ',
      input: 'text',
      inputLabel: 'ระบุเหตุผล',
      showCancelButton: true,
      confirmButtonColor: '#e74a3b',
      confirmButtonText: 'ปฏิเสธ'
    }).then((result) => {
      if (result.isConfirmed) {
        showLoading(true);
        google.script.run.withSuccessHandler(afterUpdate).updateBookingStatus(row, 'Rejected', result.value, currentUser, adminAuth);
      }
    });
  }

  function afterUpdate(res) {
    showLoading(false);
    if (res.success) {
      Swal.fire('เรียบร้อย', res.message, 'success');
      loadBookings();
    } else {
      Swal.fire('ผิดพลาด', res.message, 'error');
    }
  }

  function exportPdf(row) {
    showLoading(true);
    google.script.run
      .withSuccessHandler(res => {
        showLoading(false);
        if (res.success) {
          const link = document.createElement('a');
          link.href = 'data:application/pdf;base64,' + res.data;
          link.download = res.filename;
          link.click();
        } else {
          Swal.fire('Error', res.message, 'error');
        }
      })
      .generateBookingPdf(row);
  }

  // --- Statistics & Dashboard ---

  function loadStats() {
    const start = document.getElementById('statStart');
    const end = document.getElementById('statEnd');
    if(!start || !end) return;

    google.script.run.withSuccessHandler(renderStats).getStats(start.value, end.value);
  }

  function renderStats(data) {
    if (!data.success) return;
    const totalEl = document.getElementById('totalBookings');
    if(totalEl) totalEl.innerText = data.total;

    updateChart('carChartCtx', data.byCar, 'รถที่ถูกใช้งานมากที่สุด');
    updateChart('workChartCtx', data.byWork, 'ประเภทงานยอดนิยม', 'doughnut');
  }

  function updateChart(canvasId, dataObj, label, type='pie') {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const labels = Object.keys(dataObj);
    const data = Object.values(dataObj);
    const total = data.reduce((a, b) => a + b, 0);
    const colors = ['#4e73df', '#1cc88a', '#36b9cc', '#f6c23e', '#e74a3b', '#858796', '#5a5c69', '#f8f9fc'];

    const config = {
      type,
      data: {
        labels,
        datasets: [{
          data,
          backgroundColor: colors
        }]
      },
      options: {
        responsive: true,
        plugins: {
          tooltip: {
            callbacks: {
              label: function(context) {
                let val = context.raw || 0;
                let pct = total > 0 ? ((val / total) * 100).toFixed(1) + '%' : '0%';
                return `${context.label}: ${val} (${pct})`;
              }
            }
          },
          legend: {
            position: 'bottom',
            labels: {
              generateLabels: function(chart) {
                 const data = chart.data;
                 if (data.labels.length && data.datasets.length) {
                    return data.labels.map((label, i) => {
                       const meta = chart.getDatasetMeta(0);
                       const style = meta.controller.getStyle(i);
                       const val = data.datasets[0].data[i];
                       const pct = total > 0 ? ((val / total) * 100).toFixed(1) + '%' : '0%';
                       return {
                          text: `${label} - ${val} (${pct})`,
                          fillStyle: style.backgroundColor,
                          strokeStyle: style.borderColor,
                          lineWidth: style.borderWidth,
                          hidden: isNaN(data.datasets[0].data[i]) || meta.data[i].hidden,
                          index: i
                       };
                    });
                 }
                 return [];
              }
            }
          }
        }
      }
    };

    if (canvasId === 'carChartCtx') {
      if (carChart) carChart.destroy();
      carChart = new Chart(ctx, config);
    } else {
      if (workChart) workChart.destroy();
      workChart = new Chart(ctx, config);
    }
  }

  function exportSummaryPdf() {
    const start = document.getElementById('statStart').value;
    const end = document.getElementById('statEnd').value;
    showLoading(true);
    google.script.run.withSuccessHandler(res => {
      showLoading(false);
      if(res.success) {
         const link = document.createElement('a');
         link.href = 'data:application/pdf;base64,' + res.data;
         link.download = res.filename;
         link.click();
      } else {
         Swal.fire('Error', res.message, 'error');
      }
    }).generateSummaryPdf(start, end);
  }

  // --- Helpers ---

  function val(id) {
    const el = document.getElementById(id);
    return el ? el.value.trim() : '';
  }

  function toggleOtherVehicle() {
    const el = document.getElementById('vehicleType');
    if(!el) return;
    const val = el.value;
    const isOther = val === 'อื่นๆ ให้ระบุ' || val === 'other';
    const otherDiv = document.getElementById('vehicleOtherDiv');
    if(otherDiv) otherDiv.style.display = isOther ? 'block' : 'none';
    const otherInput = document.getElementById('vehicleOther');
    if(otherInput) otherInput.required = isOther;
  }

  function toggleOtherWork() {
    const el = document.getElementById('workType');
    if(!el) return;
    const val = el.value;
    const isOther = val === 'otherWork';
    const otherDiv = document.getElementById('workOtherDiv');
    if(otherDiv) otherDiv.style.display = isOther ? 'block' : 'none';
    const otherInput = document.getElementById('workOther');
    if(otherInput) otherInput.required = isOther;
  }

  function toggleDest2() {
    const d2 = document.getElementById('dest2Container');
    if(!d2) return;
    if (d2.style.display === 'none') {
      d2.style.display = 'block';
    } else {
      d2.style.display = 'none';
    }
  }

  function toggleDriveOption() {
    // Check if element exists before accessing checked property (safety)
    const selfEl = document.getElementById('driveSelf');
    if(!selfEl) return;

    const isSelf = selfEl.checked;
    const divLicense = document.getElementById('divHasLicense');
    const divDriver = document.getElementById('divDriverName');
    const inputDriver = document.getElementById('driverName');

    if (isSelf) {
      if(divLicense) divLicense.classList.remove('d-none');
      if(divDriver) divDriver.classList.add('d-none');
      if(inputDriver) inputDriver.required = false;
    } else {
      if(divLicense) divLicense.classList.add('d-none');
      if(divDriver) divDriver.classList.remove('d-none');
      if(inputDriver) inputDriver.required = true;
    }
  }

  function viewDetail(json) {
    const b = JSON.parse(json);

    // Construct driving info string
    let drivingInfo = '';
    if (b.driveOption === 'SELF') {
       drivingInfo = 'ขับเอง' + (b.hasLicense ? ' (มีใบขับขี่)' : ' (ไม่มีใบขับขี่)');
    } else if (b.driveOption === 'DRIVER') {
       drivingInfo = 'ต้องการคนขับ: ' + (b.driverName || '-');
    } else {
       drivingInfo = '-';
    }

    Swal.fire({
      title: 'รายละเอียดการจอง',
      html: `
        <div class="text-start">
          <p><strong>ผู้จอง:</strong> ${b.name} (${b.department})</p>
          <p><strong>รถ:</strong> ${b.car}</p>
          <p><strong>รูปแบบการขับขี่:</strong> ${drivingInfo}</p>
          <p><strong>วันที่:</strong> ${b.date} ${b.startTime} - ${b.returnDate} ${b.returnTime}</p>
          <hr>
          <p><strong>ต้นทาง:</strong> ${b.originPlace}</p>
          <p><strong>ปลายทาง 1:</strong> ${b.dest1Place}</p>
          ${b.dest2Place ? `<p><strong>ปลายทาง 2:</strong> ${b.dest2Place}</p>` : ''}
          <p><strong>วัตถุประสงค์:</strong> ${b.workTypes}</p>
          <p><strong>รายละเอียด:</strong> ${b.extraDetails || '-'}</p>
          <hr>
          <p><strong>สถานะ:</strong> <span class="badge bg-secondary">${b.status}</span></p>
          ${b.rejectionReason ? `<p class="text-danger">เหตุผลการปฏิเสธ: ${b.rejectionReason}</p>` : ''}
        </div>
      `,
      confirmButtonText: 'ปิด'
    });
  }

  function getStatusClass(status) {
    switch (status) {
      case 'Approved': return 'status-approved';
      case 'Rejected': return 'status-rejected';
      default: return 'status-pending';
    }
  }
