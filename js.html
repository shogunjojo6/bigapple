<script>
let currentType = '';
let currentId = '';

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

  const navItem = document.querySelector(`[onclick="showPage('${pageId}')"]`);
  if(navItem) navItem.classList.add('active');

  if (pageId === 'dashboard') {
    loadStats();
  } else if (pageId === 'books') {
    loadData('BOOK');
  } else if (pageId === 'staff') {
    loadData('ADMIN');
  } else if (pageId === 'teachers') {
    loadData('MEMBER', 'teacher');
  } else if (pageId === 'students') {
    loadData('MEMBER', 'student');
  } else if (pageId === 'borrow-return') {
    loadBorrowData();
  }
}

function loadStats() {
  google.script.run.withSuccessHandler(stats => {
    document.getElementById('stat-books').innerText = stats.books;
    document.getElementById('stat-members').innerText = stats.members;
    document.getElementById('stat-borrows').innerText = stats.borrows;
  }).getStats();
}

function loadData(type, filterType) {
  currentType = type;
  const containerId = filterType ? `table-${filterType}s` : `table-${type.toLowerCase()}`;
  const container = document.getElementById(containerId);
  if (!container) return;

  container.innerHTML = '<div class="text-center">Loading...</div>';

  google.script.run.withSuccessHandler(data => {
    if (filterType) {
      data = data.filter(item => item.member_type === filterType);
    }
    renderTable(data, type, container, filterType);
  }).readData(type);
}

function renderTable(data, type, container, filterType) {
  if (data.length === 0) {
    container.innerHTML = '<p>No records found.</p>';
    return;
  }

  let html = '<table><thead><tr>';
  const headers = Object.keys(data[0]);

  const displayHeaders = headers.filter(h => !h.includes('password'));

  displayHeaders.forEach(h => {
    html += `<th>${h.replace(/_/g, ' ').toUpperCase()}</th>`;
  });
  html += '<th>ACTIONS</th></tr></thead><tbody>';

  data.forEach(row => {
    html += '<tr>';
    displayHeaders.forEach(h => {
      html += `<td>${row[h]}</td>`;
    });

    let idCol = type === 'ADMIN' ? 'admin_id' : (type === 'BOOK' ? 'book_id' : 'member_id');
    let id = row[idCol];

    const rowString = JSON.stringify(row).replace(/'/g, "&#39;");

    html += `<td>
      <button class="btn btn-primary badge" onclick='openModal("${type}", "edit", ${rowString}, "${filterType || ''}")'>Edit</button>
      <button class="btn btn-danger badge" onclick="deleteItem('${type}', '${idCol}', '${id}', '${filterType || ''}')">Delete</button>
    </td></tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

function openModal(type, mode, data = null, filterType = '') {
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modal-title').innerText = mode === 'add' ? 'Add New' : 'Edit Record';
  const form = document.getElementById('dynamic-form');
  form.innerHTML = '';
  currentId = data ? (type === 'ADMIN' ? data.admin_id : (type === 'BOOK' ? data.book_id : data.member_id)) : '';

  const fields = getFields(type);

  fields.forEach(field => {
    let value = data ? data[field.name] : '';
    if (field.name === 'member_type' && filterType) {
        value = filterType;
    }

    let inputHtml = '';
    if (field.type === 'select') {
      inputHtml = `<select name="${field.name}" required ${field.readonly ? 'disabled' : ''}>
        ${field.options.map(opt => `<option value="${opt}" ${value === opt ? 'selected' : ''}>${opt}</option>`).join('')}
      </select>`;

      if (field.readonly) {
          inputHtml += `<input type="hidden" name="${field.name}" value="${value}">`;
      }
    } else {
      inputHtml = `<input type="${field.type}" name="${field.name}" value="${value}" ${field.required ? 'required' : ''} ${field.readonly ? 'readonly' : ''}>`;
    }

    const hiddenClass = (field.name === 'member_type' && filterType) ? 'hidden' : '';

    form.innerHTML += `
      <div class="form-group ${hiddenClass}">
        <label>${field.label}</label>
        ${inputHtml}
      </div>
    `;
  });

  if (type === 'MEMBER' && filterType) {
       form.innerHTML += `<input type="hidden" name="member_type" value="${filterType}">`;
  }

  form.onsubmit = (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const obj = {};
    formData.forEach((value, key) => obj[key] = value);

    if (type === 'MEMBER' && !obj.registration_date) obj.registration_date = new Date().toISOString().split('T')[0];


    if (mode === 'add') {
         if (type === 'ADMIN') obj.admin_id = 'AD' + Date.now();
         if (type === 'BOOK') obj.book_id = 'BK' + Date.now();
         if (type === 'MEMBER') obj.member_id = 'MB' + Date.now();
    }

    const idCol = type === 'ADMIN' ? 'admin_id' : (type === 'BOOK' ? 'book_id' : 'member_id');

    const callback = () => {
        closeModal();
        loadData(type, filterType);
    };

    if (mode === 'add') {
      google.script.run.withSuccessHandler(callback).createData(type, obj);
    } else {
      google.script.run.withSuccessHandler(callback).updateData(type, idCol, currentId, obj);
    }
  };
}

function getFields(type) {
  if (type === 'ADMIN') {
    return [
      { name: 'username', label: 'Username', type: 'text', required: true },
      { name: 'password', label: 'Password', type: 'password', required: true }
    ];
  } else if (type === 'BOOK') {
    return [
      { name: 'title', label: 'Title', type: 'text', required: true },
      { name: 'author', label: 'Author', type: 'text', required: true },
      { name: 'publisher', label: 'Publisher', type: 'text', required: true },
      { name: 'publication_year', label: 'Year', type: 'number', required: true },
      { name: 'isbn', label: 'ISBN', type: 'text', required: true },
      { name: 'quantity', label: 'Quantity', type: 'number', required: true }
    ];
  } else if (type === 'MEMBER') {
    return [
      { name: 'name', label: 'Name', type: 'text', required: true },
      { name: 'address', label: 'Address', type: 'text', required: true },
      { name: 'phone', label: 'Phone', type: 'text', required: true },
      { name: 'email', label: 'Email', type: 'email', required: true },
      { name: 'password', label: 'Password', type: 'password', required: true },
      { name: 'member_type', label: 'Type', type: 'select', options: ['teacher', 'student'], required: true }
    ];
  }
  return [];
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
}

function deleteItem(type, idCol, id, filterType) {
  if(confirm('Are you sure you want to delete this record?')) {
    google.script.run.withSuccessHandler(() => {
      loadData(type, filterType);
    }).deleteData(type, idCol, id);
  }
}

function search(type, filterType) {
    const searchId = filterType ? `search-${filterType}s` : `search-${type.toLowerCase()}`;
    const query = document.getElementById(searchId).value;
    const containerId = filterType ? `table-${filterType}s` : `table-${type.toLowerCase()}`;
    const container = document.getElementById(containerId);

    google.script.run.withSuccessHandler(data => {
        if (filterType) {
            data = data.filter(item => item.member_type === filterType);
        }
        renderTable(data, type, container, filterType);
    }).searchData(type, query);
}


function loadBorrowData() {
    google.script.run.withSuccessHandler(data => {
       renderBorrowTable(data);
       loadSelectOptions();
    }).readData('BORROW');
}

function renderBorrowTable(data) {
    const container = document.getElementById('table-borrow');
    if (data.length === 0) {
        container.innerHTML = '<p>No history.</p>';
        return;
    }

    data.sort((a,b) => b.borrow_id.localeCompare(a.borrow_id));

    let html = '<table><thead><tr><th>ID</th><th>Member ID</th><th>Book ID</th><th>Borrow Date</th><th>Due Date</th><th>Return Date</th><th>Action</th></tr></thead><tbody>';
    data.forEach(row => {
        html += `<tr>
            <td>${row.borrow_id}</td>
            <td>${row.member_id}</td>
            <td>${row.book_id}</td>
            <td>${row.borrow_date}</td>
            <td>${row.due_date}</td>
            <td>${row.return_date || '<span class="badge badge-warning">On Loan</span>'}</td>
            <td>${!row.return_date ? `<button class="btn btn-primary badge" onclick="returnBook('${row.borrow_id}')">Return</button>` : '<span class="badge badge-success">Returned</span>'}</td>
        </tr>`;
    });
    html += '</tbody></table>';
    container.innerHTML = html;
}

function loadSelectOptions() {
    google.script.run.withSuccessHandler(members => {
        const sel = document.getElementById('borrow-member');
        sel.innerHTML = '<option value="">Select Member</option>';
        members.forEach(m => sel.innerHTML += `<option value="${m.member_id}">${m.name} (${m.member_type})</option>`);
    }).readData('MEMBER');

    google.script.run.withSuccessHandler(books => {
        const sel = document.getElementById('borrow-book');
        sel.innerHTML = '<option value="">Select Book</option>';
        books.forEach(b => {
            if(parseInt(b.quantity) > 0) sel.innerHTML += `<option value="${b.book_id}">${b.title} (Qty: ${b.quantity})</option>`;
        });
    }).readData('BOOK');
}

function handleBorrow(e) {
    e.preventDefault();
    const memberId = document.getElementById('borrow-member').value;
    const bookId = document.getElementById('borrow-book').value;
    if(!memberId || !bookId) return;

    google.script.run.withSuccessHandler(res => {
        if(res === 'Success') {
            loadBorrowData();
            document.getElementById('borrow-form').reset();
        } else {
            alert('Error: ' + res);
        }
    }).borrowBook(memberId, bookId);
}

function returnBook(borrowId) {
    if(confirm('Confirm return?')) {
        google.script.run.withSuccessHandler(res => {
             if(res === 'Success') {
                loadBorrowData();
            } else {
                alert('Error: ' + res);
            }
        }).returnBook(borrowId);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    showPage('dashboard');
});
</script>
